[project]
name = "dch-bridge"
version = "0.1.0"
description = "Duck Curve Home – Bridge: Home-Assistant-Add-on, verbindet das Haus ausgehend mit der API"
requires-python = ">=3.12"
dependencies = [
    "hems-core",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "structlog>=24.4",
    "websockets>=13.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.scripts]
dch-bridge = "dch_bridge.main:run"

[tool.uv.sources]
hems-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dch_bridge"]
