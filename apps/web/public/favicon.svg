  <g transform="translate(-152 36) scale(1.0595)">
    <path fill="#0F2E3D" d="M238 585c0-130 78-227 194-255-11-26-17-55-17-85 0-112 91-203 203-203s203 91 203 203c0 50-18 96-49 131 39 20 73 47 99 80 36 45 69 48 107 5 17-19 32-15 35 12 13 126-33 258-145 325-84 51-198 66-331 57-176-12-299-105-299-270z"/>
    <path fill="#F2A900" d="M426 238c-74 8-132 31-178 68 54 25 111 34 173 23 25-5 40-25 35-47-5-24-14-39-30-44z"/>
    <circle cx="587" cy="220" r="23" fill="#FFFFFF"/>
