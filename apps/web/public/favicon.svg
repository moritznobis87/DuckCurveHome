<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="Duck Curve">
  <!-- Die Marken-Ente, unveraendert aus den Markenassets uebernommen
       (marke/ente-einfach.svg im Repository valyze) - dieselbe Ente wie
       in der Anwendung. Hier steht sie auf der hellen Kachel, wie im
       Markenicon brand/duck-icon.png: Der Koerper ist petrol, und auf
       einer dunklen Tab-Leiste verschwaende er ohne sie.
       Die Fassung mit Laecheln (ente-begleiter.svg) taugt fuer das
       Favicon nicht: Das Laecheln ist ein Strich von 18 Einheiten, bei
       16 Pixeln also ein Viertelpixel breit - genau der Fehler der
       Entenkurve, die vorher hier stand. Diese Ente ist reine Flaeche. -->
