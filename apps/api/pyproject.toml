[project]
name = "dch-api"
version = "0.1.0"
description = "Duck Curve Home – API, Live-Stream, Worker"
requires-python = ">=3.12"
dependencies = [
    "hems-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "structlog>=24.4",
    "sse-starlette>=2.1",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "httpx>=0.27",
    "websockets>=13.0",
    "pyyaml>=6.0",
    "pypdf>=5.1",  # Text aus Tibber-Rechnungen lesen
]

[project.scripts]
dch-api = "dch_api.main:run"

[tool.uv.sources]
hems-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dch_api"]
