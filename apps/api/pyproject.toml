[project]
name = "dch-api"
version = "0.1.0"
description = "Duck Curve Home – API, Live-Stream, Worker"
requires-python = ">=3.12"
dependencies = [
    "hems-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "structlog>=24.4",
    "sse-starlette>=2.1",
]

[project.scripts]
dch-api = "dch_api.main:run"

[tool.uv.sources]
hems-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dch_api"]
