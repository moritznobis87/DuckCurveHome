name: Duck Curve Home Bridge
version: "0.4.0"
slug: duckcurve_bridge
description: Verbindet das Haus ausgehend mit Duck Curve Home (Railway). Shellys direkt über MQTT, übrige Entitäten und Aktoren über Home Assistant.
url: https://github.com/moritznobis87/DuckCurveHome
arch: [aarch64, amd64, armv7]
startup: services
boot: auto
init: false
homeassistant_api: true
hassio_api: false
map:
  - config:rw
options:
  api_ws_url: ""
  api_token: ""
  bridge_id: "haus"
  entities_file: "/config/duckcurve/entities.yaml"
  heartbeat_entity: "sensor.duckcurve_bridge_heartbeat"
  offline_release_s: 180
  log_level: "INFO"
  source_mode: "mqtt"
  mqtt_host: "core-mosquitto"
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  shelly_device_id: ""
  mqtt_topic_prefix: ""
  mqtt_publish_interval_s: 10
  mqtt_stale_s: 90
  mqtt_qos: 1
schema:
  api_ws_url: str
  api_token: password
  bridge_id: str
  entities_file: str
  heartbeat_entity: str
  offline_release_s: int(60,3600)
  log_level: list(DEBUG|INFO|WARNING|ERROR)
  source_mode: list(home_assistant|mqtt|compare)
  mqtt_host: str
  mqtt_port: port
  mqtt_username: str?
  mqtt_password: password?
  shelly_device_id: str?
  mqtt_topic_prefix: str?
  mqtt_publish_interval_s: int(2,300)
  mqtt_stale_s: int(30,3600)
  mqtt_qos: int(0,2)
