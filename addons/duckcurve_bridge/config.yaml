name: Duck Curve Home Bridge
version: "0.12.0"
slug: duckcurve_bridge
description: Verbindet das Haus ausgehend mit Duck Curve Home (Railway). Shellys direkt über MQTT, den MCZ-Pelletofen über sein Maestro-Modul, übrige Entitäten und Aktoren über Home Assistant. Öffnet auf Wunsch die Haustür, wenn der UniFi-Access-Reader ein freigegebenes Gesicht erkennt.
url: https://github.com/moritznobis87/DuckCurveHome
arch: [aarch64, amd64, armv7]
startup: services
boot: auto
init: false
homeassistant_api: true
hassio_api: false
map:
  - config:rw
options:
  api_ws_url: ""
  api_token: ""
  bridge_id: "haus"
  entities_file: "/config/duckcurve/entities.yaml"
  entities_url: "https://raw.githubusercontent.com/moritznobis87/DuckCurveHome/main/config/entities.home.yaml"
  heartbeat_entity: "sensor.duckcurve_bridge_heartbeat"
  offline_release_s: 180
  log_level: "INFO"
  source_mode: "mqtt"
  mqtt_host: "core-mosquitto"
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  shelly_device_id: ""
  mqtt_topic_prefix: ""
  mqtt_publish_interval_s: 10
  mqtt_stale_s: 90
  mqtt_qos: 1
  mqtt_poll_interval_s: 120
  mcz_host: ""
  mcz_port: 81
  mcz_poll_interval_s: 15
  mcz_allow_control: true
  alarm_entity: ""
  alarm_arm_enabled: false
  controme_host: ""
  controme_house_id: 0
  controme_poll_interval_s: 120
  controme_user: ""
  controme_password: ""
  # Haustür. Ohne unifi_host bleibt der Dienst aus, ebenso ohne Ziel (door_entity bzw. nuki_host).
  # Mit Zugangsdaten, aber ohne door_enabled läuft er im Beobachtungsbetrieb: er protokolliert
  # jeden Zutritt und rührt das Schloss nicht an. Die Werte für die drei Listen stehen dann im
  # Protokoll - siehe DOCS.md.
  unifi_host: ""
  unifi_port: 12445
  unifi_token: ""
  # Wer öffnet. `home_assistant` ruft `door_service` auf `door_entity` auf; das Schloss bleibt
  # dabei auf Thread, sein WLAN bleibt aus, die Batterie hält. `nuki_bridge` spricht über das
  # Steckdosengerät und dessen lokale HTTP-API, per Bluetooth zum Schloss - der Ausweg, falls
  # sich die Strecke über Home Assistant als unzuverlässig erweist.
  door_opener: "home_assistant"
  door_entity: ""
  door_service: "lock.open"
  nuki_host: ""
  nuki_port: 8080
  nuki_token: ""
  nuki_id: ""
  door_enabled: false
  door_doors: ""
  door_actors: ""
  door_methods: ""
schema:
  api_ws_url: str
  api_token: password
  bridge_id: str
  entities_file: str
  entities_url: str?
  heartbeat_entity: str
  offline_release_s: int(60,3600)
  log_level: list(DEBUG|INFO|WARNING|ERROR)
  source_mode: list(home_assistant|mqtt|compare)
  mqtt_host: str
  mqtt_port: port
  mqtt_username: str?
  mqtt_password: password?
  shelly_device_id: str?
  mqtt_topic_prefix: str?
  mqtt_publish_interval_s: int(2,300)
  mqtt_stale_s: int(30,3600)
  mqtt_qos: int(0,2)
  mqtt_poll_interval_s: int(0,3600)
  mcz_host: str?
  mcz_port: port
  mcz_poll_interval_s: int(5,600)
  mcz_allow_control: bool
  alarm_entity: str?
  alarm_arm_enabled: bool
  controme_host: str?
  controme_house_id: int(0,9)
  controme_poll_interval_s: int(30,3600)
  controme_user: str?
  controme_password: password?
  unifi_host: str?
  unifi_port: port
  unifi_token: password?
  door_opener: list(home_assistant|nuki_bridge)
  door_entity: str?
  door_service: str
  nuki_host: str?
  nuki_port: port
  nuki_token: password?
  nuki_id: str?
  door_enabled: bool
  door_doors: str?
  door_actors: str?
  door_methods: str?
