# Duck Curve Home - Anlagen- und Reglerkonfiguration (DCH_CONFIG_FILE). Alle Werte optional; Defaults siehe CONFIGURATION.md.
site:
  name: Geilenkirchen
  location: { latitude: 50.97, longitude: 6.12, elevation_m: 80 }
  timezone: Europe/Berlin
pv_system:
  arrays:
    - { name: main_roof, capacity_kwp: 9.9, azimuth_deg: 180, tilt_deg: 35 }
  inverter_ac_kw: 8.25
  loss_factor: 0.14
hems:
  heat_pump:
    minimum_electric_power_kw: 3.5
    min_runtime_min: 30
    min_offtime_min: 20
  control:
    pv: { on_surplus_kw: 4.0, off_import_kw: 1.5, on_delay_min: 5, off_delay_min: 10 }
    price: { cheap_quantile: 0.10 }
    block: { enabled: false }
  buffer:
    volume_liters: 1000
    min_useful_temperature_c: 35
    target_temperature_c: 50
    max_temperature_c: 62
  battery:
    # myenergi Libbi. `control_enabled` gibt DCH die Betriebsart des Speichers frei (Stopped /
    # Normal über die Hub-API). `reserve_soc` ist die Untergrenze des Ladestands als Anteil:
    # darunter hält DCH den Speicher an, statt ihn die letzten Prozent fahren zu lassen. Die
    # bringen nichts und lösen beim Libbi eine Netznachladung aus, siehe
    # hems_core.control.battery_reserve. 0.0 schaltet die Grenze ab.
    capacity_kwh: 5.1
    max_power_kw: 3.7
    control_enabled: false
    reserve_soc: 0.0
  stove:
    # Pelletofen (MCZ Star Hydromatic). Die Zahlen bestimmen, ab wann der Ofen günstiger heizt als
    # die Wärmepumpe, siehe hems_core.accounting.stove_cost und docs/OFEN_OPTIMIERUNG.md.
    present: true
    control_enabled: true  # darf DCH ihn schalten? Freigegeben; Sicherungen in OFEN_OPTIMIERUNG.md
    nominal_heat_kw: 11.9  # Gesamtwärmeleistung bei Volllast, laut Datenblatt
    water_heat_kw: 10.0  # davon in den Pufferspeicher; 1,9 kW heizen die Küche
    combustion_efficiency: 0.911  # Wirkungsgrad bei Maximalbetrieb
    min_heat_kw: 3.2  # Teillast, dort ist der Wirkungsgrad besser: 96,1 %
    min_water_heat_kw: 1.8
    min_combustion_efficiency: 0.961
    electric_w: 75.0  # Eigenverbrauch im Betrieb
    electric_ignition_w: 390.0  # Spitze beim Zünden
    # Datenblattwerte als Gegenprobe: die gerechnete Kette muss 2,7 kg/h treffen.
    pellet_kg_per_hour_max: 2.7
    pellet_kg_per_hour_min: 0.7
    # Gewogen: in den 31-l-Behälter passen 15 kg. Zusammen mit einmal Nachfüllen am Tag ergibt
    # das ein hartes Tagesbudget von 15 kg, also höchstens 56 kWh in den Puffer.
    hopper_kg: 15.0
    refills_per_day: 1.0
    refill_hour: 7  # wann nachgefuellt wird; das Budgetfenster laeuft von hier bis hier
    # Der Pelletpreis der letzten Lieferung. Er geht linear in den Wärmepreis ein: verdoppelt er
    # sich, verdoppelt sich der Wärmepreis. Nach jedem Kauf hier nachziehen.
    pellet_price_eur_per_t: 450.0
    # 4,9 kWh/kg ist der Normwert bei 8 % Feuchte (ENplus A1 fordert mindestens 4,6). Steht auf dem
    # Lieferschein ein anderer Wert, gehört der hierher.
    pellet_kwh_per_kg: 4.9
    # Zählt die Wärme, die der Ofen in die Küche abgibt, als Nutzen? In der Heizperiode ja, denn sie
    # ersetzt Wärme, die sonst die Wärmepumpe liefern müsste. Der Wert entscheidet mit darüber, ob
    # der Ofen billiger rechnet: 1,0 ergibt 10,3 ct/kWh, 0,0 ergibt 12,2 ct/kWh.
    room_heat_credit: 1.0
    min_runtime_min: 120
    min_offtime_min: 60
  tariff:
    # Einspeisevergütung netto laut Bescheid des Netzbetreibers. Die Tibber-Preise der Zeitreihe sind
    # Bruttopreise; der Eigenverbrauch wird für die Umsatzsteuer daraus netto bewertet.
    feed_in_ct_kwh: 7.41
    fallback_import_ct_kwh: 30.0
    vat_rate: 0.19
    price_includes_vat: true
    small_business: false
