# Duck Curve Home – Entity-Mapping für das Haus in Geilenkirchen.
# Nach Home Assistant kopieren als /config/duckcurve/entities.yaml (Option `entities_file` im Add-on).
#
# Quelle der Zuordnung: Entity-Liste aus HA vom 05.09.2026, aufgenommen bei PV 7,65 kW, Einspeisung 2,38 kW,
# Batterie lädt 0,45 kW, Wärmepumpe 3,0 kW. Domänenkonvention: grid > 0 Bezug, battery > 0 Entladen; kW.
#
# Zusammenhang der myenergi-Werte zum Aufnahmezeitpunkt (Plausibilitätscheck):
#   generation 7650 W + grid −2378 W − battery charging 445 W = home consumption 4827 W  ✓

sensors:
  # --- Elektrische Leistungen (myenergi Hub / harvi / libbi / zappi) ---
  # PV gesamt: harvi-CTs an den drei PV-Phasen (2573 + 2542 + 2535 W). Der Hub-Wert ist identisch mit
  # sensor.photovoltaic_total und sensor.myenergi_harvi_11546287_power_ct_generation.
  - { key: pv_power_kw,        entity: sensor.myenergi_hub_14117600_power_generation,     unit: W, stale_after_s: 120 }
  # Netz: negativ = Einspeisung (power_export 2378 W bei power_grid −2378 W) → import_positive.
  - { key: grid_power_kw,      entity: sensor.myenergi_hub_14117600_power_grid,           unit: W, sign: import_positive, stale_after_s: 120 }
  # Batterie (libbi): interner Last-CT ist beim Laden positiv (445 W bei "Battery charge today" steigend).
  # ⚠ Vorzeichen beim Entladen noch verifizieren (erwartet negativ) – siehe docs/OPEN_QUESTIONS.md.
  - { key: battery_power_kw,   entity: sensor.myenergi_libbi_26244255_power_ct_internal_load, unit: W, sign: charge_positive, stale_after_s: 120 }
  - { key: battery_soc,        entity: sensor.myenergi_libbi_26244255_soc,                unit: "%", stale_after_s: 600 }
  # Wallbox (zappi): interner Last-CT = Ladeleistung des Autos.
  - { key: ev_power_kw,        entity: sensor.myenergi_wallbox_power_ct_internal_load,    unit: W, stale_after_s: 120 }
  # Hausverbrauch laut Hub – nur Plausibilitätsprüfung; die Bilanz rechnet DCH selbst.
  - { key: house_power_kw,     entity: sensor.myenergi_hub_14117600_home_consumption,     unit: W, stale_after_s: 120 }

  # --- Wärmepumpe: Shelly 3EM, Summe der drei Phasen (HA-Template-Sensor) ---
  - { key: heat_pump_power_kw, entity: sensor.heatpump_total_power,                       unit: W, stale_after_s: 60 }

  # --- Pufferspeicher: Shelly Plus 1 mit Temperatur-Add-on (5 Fühler, Nr. 4 liefert "unknown") ---
  # ⚠ Reihenfolge angenommen: 1 = oben … 5 = unten. Bitte am Speicher prüfen und ggf. tauschen.
  - { key: buffer_temp_top_c,        entity: sensor.speicher_1_temperature, unit: "°C", stale_after_s: 3600 }
  - { key: buffer_temp_mid_top_c,    entity: sensor.speicher_2_temperature, unit: "°C", stale_after_s: 3600 }
  - { key: buffer_temp_mid_bottom_c, entity: sensor.speicher_3_temperature, unit: "°C", stale_after_s: 3600 }
  - { key: buffer_temp_bottom_c,     entity: sensor.speicher_5_temperature, unit: "°C", stale_after_s: 3600 }

  # --- Umgebung ---
  - { key: outdoor_temp_c,     entity: sensor.geilenkirchen_air_base_temperatur,          unit: "°C", stale_after_s: 3600 }

  # Strompreis kommt serverseitig direkt von Tibber (DCH_TIBBER_TOKEN) – hier nichts mappen.

actuators:
  # --- Komfort-Schalter (Shelly) ---
  - { key: coffee_machine,     entity: switch.shelly1pm_34945472c2c5, label: Kaffeemaschine }
  # Drei Lichterketten: Terrasse, Innenhof, Gartenzaun – einheitlich „Licht <Ort>“.
  - { key: terrace_light,      entity: switch.shellyterrassenlicht,   label: Licht Terrasse }
  - { key: garden_fence_light, entity: switch.shellygartenzaun,       label: Licht Gartenzaun }
  # Innenhof: Shelly Plus Plug S „Lichterkette_Innenhof“ (Kennung shellyplusplugs-64b7080cc70c),
  # am 06.09.2026 in HA eingerichtet. HA slugifiziert den Gerätenamen, daher Unterstriche statt Bindestriche.
  - { key: courtyard_light,    entity: switch.shellyplusplugs_64b7080cc70c, label: Licht Innenhof }

  # --- Wärmepumpen-Kontakte K1 (PV-Freigabe) und K2 (EVU-Sperre) ---
  # ⚠ NOCH NICHT ZUGEORDNET. Kandidaten aus HA: switch.warmepumpe (aktuell AN), switch.heatpump_measurement
  # (Relais des Shelly 3EM), switch.temperaturen_heizung (Relais des Shelly Plus 1 mit Temperaturfühlern).
  # Erst eintragen, wenn die Verdrahtung zum ELCO-Regler bestätigt ist. Ein Shelly, der die WP-Versorgung
  # schaltet, darf hier NIE stehen. Bis dahin bleibt die Steuerung reine Beobachtung.
  # K1 „PV-Überschuss“: bestätigt am 06.09.2026 – switch.warmepumpe fordert den Überschussbetrieb an und
  # schaltet die Wärmepumpe NICHT stromlos. Sicherer Zustand ist „aus“ (WP läuft dann in eigener Regelung).
  - { key: hp_release_contact, entity: switch.warmepumpe, label: WP PV-Freigabe, safety_class: heat_pump, safe_state: false }
  # K2 „EVU-Sperre“: der Abschaltkontakt an der Wärmepumpe ist noch nicht belegt – nichts zu mappen.
  # - { key: hp_block_contact,   entity: switch.<K2>, label: WP Sperre,      safety_class: heat_pump, safe_state: false }

# ---------------------------------------------------------------------------
# Shellys, die die Bridge direkt über den lokalen Mosquitto liest (ohne Umweg über HA).
# Aktiv nur bei source_mode: mqtt oder compare. Schlüssel, die hier auftauchen, kommen dann
# NICHT mehr aus Home Assistant – die passenden `sensors:`-Einträge oben bleiben als Fallback
# für source_mode: home_assistant stehen. Alles, was hier NICHT steht, läuft unverändert über HA.
mqtt:
  # --- Nicht über MQTT: die Geräte der ersten Generation ---
  # Der Wärmepumpen-Zähler (Shelly 3EM), der Wärmepumpenschalter und die Kaffeemaschine bleiben bei
  # Home Assistant. Grund: beim Gen-1-Shelly schaltet aktiviertes MQTT den CoIoT-Kanal ab, über den die
  # HA-Shelly-Integration arbeitet – die Schalter in HA gingen verloren. Das ist beim WP-Kontakt nicht
  # hinnehmbar. Die Bridge mischt problemlos: bei source_mode mqtt übergeht sie in HA nur die Schlüssel,
  # die hier unten stehen; heat_pump_power_kw und die Aktoren kommen weiter über Home Assistant.

  # --- Pufferspeicher: Shelly Plus 1 mit Temperatur-Add-on (Generation 2) ---
  # ⚠ WICHTIG: `prefix` ist der im Gerät eingestellte MQTT-Name, NICHT die Gerätekennung
  # (shellyplus1-b8d61a86e20c). Bestätigt am 06.09.2026 an der Terrassensteckdose, die unter
  # „Lichterkette_Terassenlicht/events“ sendet, obwohl ihre Kennung shellyplusplugs-d4d4daf36370 lautet.
  # Präfix und Fühlerreihenfolge am 06.09.2026 am Broker bestätigt: aufsteigende Komponenten-ID =
  # absteigende Temperatur, also 100 oben … 104 unten. Fühler 4 (temperature:103) ist defekt
  # („unknown“) und bleibt unbelegt; 104 ist damit der unterste belegte Fühler.
  # Voraussetzung im Gerät: MQTT aktiv, „RPC status notifications over MQTT“ ein und (seit 06.09.2026
  # gesetzt) „Generic status update over MQTT“, das auch ohne Änderung regelmäßig einen Vollstand schickt.
  - prefix: "Pufferspeicher_Temperaturen"
    generation: 2
    label: "Pufferspeicher"
    components:
      "temperature:100": buffer_temp_top_c
      "temperature:101": buffer_temp_mid_top_c
      "temperature:102": buffer_temp_mid_bottom_c
      "temperature:104": buffer_temp_bottom_c

  # --- Bekannte Shelly-Plus-Steckdosen am Broker (Stand 06.09.2026) ---
  # Sie senden bereits, sind hier aber noch nicht eingebunden: Schalten läuft weiter über Home Assistant
  # (Aktoren unten), und die Bridge schickt über MQTT bislang nur Messwerte.
  #   Kennung                       Topic-Präfix (= Gerätename)  HA-Entität
  #   shellyplusplugs-d4d4daf36370  Lichterkette_Terassenlicht   switch.shellyterrassenlicht
  #   shellyplusplugs-d4d4daf36158  Licht_Gartenzaun             switch.shellygartenzaun
  #   shellyplusplugs-64b7080cc70c  Lichterkette_Innenhof        switch.shellyplusplugs_64b7080cc70c
  # Alle drei am 06.09.2026 am Broker bestätigt. Sie liefern je switch:0 mit apower (W) und
  # aenergy.total (Wh) – einbindbar, sobald die Leistungsschlüssel serverseitig vorgesehen sind.
