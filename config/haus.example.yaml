# Duck Curve Home - Hausplan fuer die Modellansicht (Bereich Haus).
#
# Diese Datei beschreibt ein ERFUNDENES Haus: dasselbe, das die Vorfuehrung zeigt. Der Plan des
# eigenen Hauses gehoert nicht ins Repository, sondern nach Home Assistant als
# /config/duckcurve/haus.yaml (Option `house_file` im Add-on). Die Bruecke liest ihn beim Start und
# danach alle 30 Sekunden auf Aenderung, prueft ihn und meldet ihn als Ereignis; der Dienst zeigt
# ihn unter /haus. Ein Fehler in der Datei steht im Protokoll der Bruecke und auf der Seite.
#
# Koordinaten in Metern. x waechst nach rechts, z nach unten (oben ist Norden, wenn man das Haus so
# zeichnet), y nach oben. Ein Raum ist ein Rechteck x0 < x1, z0 < z1. Winkelige Raeume setzt man
# aus mehreren Rechtecken zusammen, die Teile nennen mit `part_of` den Hauptraum und tragen
# `silent: true`.
#
# Je Deck:
#   shell        Aussenhaut als Vieleck, gegen den Uhrzeigersinn. Raumkanten darauf werden als
#                Aussenwand hoeher gezeichnet; der Schutzschild der Alarmanlage steht auf ihr
#                (oder auf `alarm_shell`, wenn ein Anbau nicht ueberwacht ist).
#   plate        Grundplatte unter dem Deck; ohne Angabe die Aussenhaut. `holes` schneiden
#                Luftraeume hinein ([x0, z0, x1, z1]).
#   rooms        name, room_id (Kennung der Einzelraumregelung; ohne sie nur der Name), x0 z0 x1 z1,
#                minor (Nebenraum, kleiner Chip), silent (kein Chip), open (kein Boden), cold
#                (unbeheizter Anbau), tech (Technikraum), tiles (Fliesenmuster), no_walls und
#                railing (Seiten n s o w ohne Wand beziehungsweise mit Gelaender), part_of.
#   walls        zusaetzliche Waende ohne Raumgrenze: x oder z der Wand, a..b laengs der Wand.
#   gaps         Tuerluecken in Waenden, gleiche Form.
#   openings     Fenster und Tueren ohne Kontakt (door: true), gleiche Form.
#   contacts     Fenster und Tueren mit Kontakt der Alarmanlage: name, key (Schluessel in der
#                Entity-Zuordnung, kind: binary, 1 = offen), room, side (n s o w), at (Koordinate
#                der Wand), a..b laengs der Wand, door.
#   items        Moebel und Geraete, siehe die Arten in hems_core/house/plan.py: box, cylinder,
#                bed, chair, stove (device: pellet bindet die Glut an den Pelletofen), ladder,
#                loft, panel, tiles, ground, wall, gate, plant, car, wallbox (x1 z1: wohin das
#                Kabel geht), heat_pump, buffer, indoor_unit, pipe, flight, landing, pit.
#                tone: dark, light, soft, water, wall, paving, terrace, slate.
#   places       Ortsmarken draussen: text, x, z.
#
# Pruefen ohne Bruecke:
#   uv run python -c "import yaml; from hems_core.house import HousePlan; HousePlan.model_validate(yaml.safe_load(open('config/haus.example.yaml')))"

