name: web
on:
  push:
    branches: [main, "claude/**"]
    paths: ["apps/web/**", "docs/openapi.json", ".github/workflows/web.yml"]
  pull_request:
    paths: ["apps/web/**", "docs/openapi.json", ".github/workflows/web.yml"]
jobs:
  check:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: apps/web/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Typen aus OpenAPI aktuell?
        run: |
          pnpm gen:types
          git diff --exit-code -- src/lib/api/types.ts || (echo "src/lib/api/types.ts ist veraltet"; exit 1)
      - run: pnpm build
        env: { DCH_API_URL: "http://localhost:8000" }
