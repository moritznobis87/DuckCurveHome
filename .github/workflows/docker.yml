name: docker
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
jobs:
  images:
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    strategy:
      matrix:
        include:
          - { name: api, context: ".", file: apps/api/Dockerfile }
          - { name: web, context: apps/web, file: apps/web/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      # Veroeffentlicht wird bei jedem Push auf main (Tag `main` und `sha-<Commit>`) und bei
      # Versions-Tags. Das Hausgeraet (deploy/haus) zieht diese Images, statt auf dem Pi zu bauen:
      # Ein Next.js-Build braucht dort Minuten und Speicher, den die Regelung nebenan braucht.
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          # github.ref_name lautet bei pull_request "<nr>/merge". Der Schraegstrich ist in einem
          # Docker-Tag nicht erlaubt, buildx bricht dann vor dem Build ab. Bei Pull Requests wird
          # nur gebaut, nicht veroeffentlicht.
          tags: |
            ghcr.io/${{ github.repository_owner }}/duckcurve-${{ matrix.name }}:${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || github.ref_name }}
            ${{ github.event_name == 'push' && format('ghcr.io/{0}/duckcurve-{1}:sha-{2}', github.repository_owner, matrix.name, github.sha) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
