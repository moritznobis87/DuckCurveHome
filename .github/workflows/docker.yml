name: docker
on:
  pull_request:
  push:
    branches: [main]
# Hintereinander statt nebeneinander: Ob ein Push eine neue Version veroeffentlicht, haengt daran,
# ob ihr Tag schon steht. Zwei Laeufe zugleich koennten beide "neu" sehen und beide `stabil` setzen.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false
jobs:
  # Die Version kommt aus docs/versionen.json (tools/version.py, CLAUDE.md "Neuerungen schreiben,
  # Versionen buendeln"). Neu ist sie, wenn auf main ihr Tag `v<version>` noch nicht steht: Dann
  # bekommen die Images zusaetzlich die Tags `<version>` und `stabil`, und nach dem Bau entsteht
  # die Veroeffentlichung auf GitHub. Bis November 2026 loeste ein von Hand gesetztes Tag den Bau
  # aus; das entfaellt, damit es nur einen Weg zu einer Version gibt.
  version:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    outputs:
      version: ${{ steps.v.outputs.version }}
      neu: ${{ steps.v.outputs.neu }}
    steps:
      - uses: actions/checkout@v4
      - name: Neuerungen pruefen
        run: python3 tools/version.py --pruefen
      - id: v
        name: Version bestimmen
        run: |
          version=$(python3 tools/version.py --aktuell)
          neu=false
          if [ "${{ github.event_name }}" = push ] && [ -z "$(git ls-remote --tags origin "refs/tags/v$version")" ]; then
            neu=true
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "neu=$neu" >> "$GITHUB_OUTPUT"
          echo "Version $version, neu: $neu"

  images:
    needs: version
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    strategy:
      matrix:
        include:
          - { name: api, context: ".", file: apps/api/Dockerfile }
          - { name: web, context: apps/web, file: apps/web/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      # Veroeffentlicht wird bei jedem Push auf main (Tag `main` und `sha-<Commit>`), bei einer
      # neuen Version dazu `<version>` und `stabil`. Das Hausgeraet (deploy/haus) zieht diese Images, statt auf dem Pi zu bauen:
      # Ein Next.js-Build braucht dort Minuten und Speicher, den die Regelung nebenan braucht.
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          # github.ref_name lautet bei pull_request "<nr>/merge". Der Schraegstrich ist in einem
          # Docker-Tag nicht erlaubt, buildx bricht dann vor dem Build ab. Bei Pull Requests wird
          # nur gebaut, nicht veroeffentlicht.
          tags: |
            ghcr.io/${{ github.repository_owner }}/duckcurve-${{ matrix.name }}:${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || github.ref_name }}
            ${{ github.event_name == 'push' && format('ghcr.io/{0}/duckcurve-{1}:sha-{2}', github.repository_owner, matrix.name, github.sha) || '' }}
            ${{ needs.version.outputs.neu == 'true' && format('ghcr.io/{0}/duckcurve-{1}:{2}', github.repository_owner, matrix.name, needs.version.outputs.version) || '' }}
            ${{ needs.version.outputs.neu == 'true' && format('ghcr.io/{0}/duckcurve-{1}:stabil', github.repository_owner, matrix.name) || '' }}
          # Commit und Version im Image. Am Commit erkennt der Update-Dienst des Hausgeraets, ob im
          # Kanal `main` ein neuerer Stand bereitsteht; die Version zeigt er an. Ein Stand nach der
          # letzten Version heisst `<version>+entwicklung`.
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.version.outputs.neu == 'true' && needs.version.outputs.version || format('{0}+entwicklung', needs.version.outputs.version) }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Der Bau allein beweist beim Web-Abbild nicht, dass es laeuft. Seine Ausgabe entsteht einmal
      # auf amd64 und wird je Ziel nur noch zugeschnitten (apps/web/Dockerfile): gebaut hat am
      # 24.11.2026 auch ein arm64-Abbild, in dem von `sharp` die x64-Fassung lag. Die naechsten
      # Schritte pruefen deshalb, was der Bau nicht prueft. Das amd64-Abbild wird gestartet: der
      # Server muss antworten, und `sharp` muss laden. Das arm64-Abbild wird nicht gestartet,
      # sondern gelesen: es muss `server.js` und von `sharp` genau die arm64-Fassung enthalten.
      # Gestartet wird es mit Absicht nicht, denn das liefe wieder unter dem Emulator, dessen
      # Abstuerze der Grund fuer den Umbau waren.
      - name: Web-Abbild fuer amd64 laden
        if: matrix.name == 'web'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          load: true
          tags: dch-web-probe:amd64
          cache-from: type=gha
      - name: Web-Abbild fuer arm64 laden
        if: matrix.name == 'web'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/arm64
          load: true
          tags: dch-web-probe:arm64
          cache-from: type=gha
      - name: Web-Abbild pruefen
        if: matrix.name == 'web'
        run: |
          docker run --detach --name probe-amd64 --publish 3000:3000 dch-web-probe:amd64
          code=000
          for versuch in $(seq 1 30); do
            code=$(curl --silent --output /dev/null --max-time 5 --write-out '%{http_code}' http://localhost:3000/api/health || true)
            if [ "$code" != "000" ]; then break; fi
            sleep 2
          done
          docker logs probe-amd64
          echo "Antwort von /api/health: $code"
          test "$code" != "000"
          docker exec probe-amd64 node -e 'const s = require(require.resolve("sharp", { paths: [require.resolve("next/package.json")] })); console.log("sharp", s.versions.sharp, process.arch)'

          docker create --name probe-arm64 --platform linux/arm64 dch-web-probe:arm64
          docker export probe-arm64 | tar --list > inhalt-arm64.txt
          grep --quiet '^app/server.js$' inhalt-arm64.txt
          grep --quiet 'sharp-linuxmusl-arm64.*\.node$' inhalt-arm64.txt
          if grep '\.node$' inhalt-arm64.txt | grep --invert-match 'sharp-linuxmusl-arm64'; then
            echo "Im arm64-Abbild liegt eine Binaerdatei, die nicht fuer arm64 und musl gebaut ist."
            exit 1
          fi

  # Erst wenn beide Images mit der Version stehen: Tag und Veroeffentlichung auf GitHub, mit den
  # Neuerungen aus docs/versionen.json als Beschreibung. `gh release create` setzt das Tag selbst.
  veroeffentlichen:
    needs: [version, images]
    if: needs.version.outputs.neu == 'true'
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - name: Veroeffentlichung anlegen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          python3 tools/version.py --notizen "$VERSION" > notizen.md
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "Version $VERSION" --notes-file notizen.md
